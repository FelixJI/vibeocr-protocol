      "get": {
        "operationId": "getRuntimeHealth",
        "responses": {
          "200": {
            "description": "Runtime health and versioned capabilities",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Error"
          }
        },
        "security": []
      }
    },
    "/v2/jobs": {
      "post": {
        "operationId": "submitJob",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "#/components/schemas/JobMultipart"
              },
              "encoding": {
                "manifest": {
                  "contentType": "application/json"
                }
              },
              "examples": {
                "singleUpload": {
                  "summary": "One OCR upload manifest; the attachment part is named attachment-0.",
                  "value": {
                    "manifest": {
                      "schema_version": 2,
                      "request_id": "request-golden",
                      "kind": "recognition",
                      "priority": "interactive",
                      "pipeline": {
                        "pipeline_id": "OCR",
                        "options_version": 1,
                        "options": {}
                      },
                      "items": [
                        {
                          "client_item_key": "item-0",
                          "ordinal": 0,
                          "display_name": "page.png",
                          "source": {
                            "type": "upload.v1",
                            "attachment": "attachment-0"
                          }
                        }
                      ],
                      "parameters": {}
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Accepted job",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JobRef"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "426": {
            "$ref": "#/components/responses/Error"
          },
          "428": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
