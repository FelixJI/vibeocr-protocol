  "components": {
    "securitySchemes": {
      "SessionToken": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "parameters": {
      "JobId": {
        "name": "job_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "SessionId": {
        "name": "session_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "OperationId": {
        "name": "operation_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1
        }
      }
    },
    "requestBodies": {},
    "responses": {
      "Error": {
        "description": "Typed runtime error",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Png": {
        "description": "PNG image",
        "content": {
          "image/png": {
            "schema": {
              "type": "string",
              "format": "binary"
            },
            "examples": {
              "onePixelPng": {
                "summary": "Base64 representation is stored in golden/runtime-api.json.",
                "value": "iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB"
              }
            }
          }
        }
      },
      "Ndjson": {
        "description": "One JSON progress event per line",
        "content": {
          "application/x-ndjson": {
            "schema": {
              "type": "string"
            },
            "examples": {
              "progress": {
                "value": "{\"phase\":\"load\",\"message\":\"loading\"}\\n"
              }
            }
          }
        }
      }
    },
    "schemas": {
      "CapabilityDescriptor": {
        "type": "object",
        "required": [
          "name",
          "lifecycle",
          "introduced_in",
          "deprecated_in",
          "sunset_at",
          "replacement"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1
          },
          "lifecycle": {
            "type": "string",
            "enum": [
              "active",
              "deprecated"
            ]
          },
          "introduced_in": {
            "type": "string",
            "minLength": 1
          },
          "deprecated_in": {
            "type": [
              "string",
              "null"
            ]
          },
          "sunset_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "replacement": {
            "type": [
              "string",
              "null"
            ]
          },
          "ocr_engine_catalog": {
            "$ref": "#/components/schemas/OcrEngineCatalog"
          },
          "download_source_catalog": {
            "$ref": "#/components/schemas/DownloadSourceCatalog"
          },
          "component_variant_catalog": {
            "$ref": "#/components/schemas/ComponentVariantCatalog"
          }
        },
        "additionalProperties": false
      },
      "AddTextLayerRequest": {
        "properties": {
          "page": {
            "title": "Page",
            "type": "integer"
          },
          "ocr_result": {
            "additionalProperties": true,
            "title": "Ocr Result",
            "type": "object"
          },
          "pdf_settings": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Pdf Settings"
          },
          "overwrite": {
            "default": false,
            "title": "Overwrite",
            "type": "boolean"
          }
        },
        "required": [
          "page",
          "ocr_result"
        ],
        "type": "object",
        "additionalProperties": false
      },
      "BatchAddTextLayerPage": {
        "description": "批量加文字层的单页条目。",
        "properties": {
          "page": {
            "title": "Page",
            "type": "integer"
          },
          "ocr_result": {
            "additionalProperties": true,
            "title": "Ocr Result",
            "type": "object"
          }
        },
        "required": [
          "page",
          "ocr_result"
        ],
        "title": "BatchAddTextLayerPage",
        "type": "object",
        "additionalProperties": false
      },
      "BatchAddTextLayerRequest": {
        "description": "批量写 OCR 文字层：一次接收一批页，后端聚合字符解析单一子集字体。\n\n避免逐页 add_text_layer 每页各解析一份子集字体（放大体积）。\n聚合逻辑复用 save_with_rewrite 已验证的\"整文档一次子集\"模式。\n\nsave=True 时，写层成功后紧跟一次 incremental save 把本批落盘\n（崩溃只丢最后一批）。返回 extra.saved 标记是否成功落盘。",
        "properties": {
          "pages": {
            "items": {
              "$ref": "#/components/schemas/BatchAddTextLayerPage"
            },
            "title": "Pages",
            "type": "array"
          },
          "pdf_settings": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Pdf Settings"
          },
          "overwrite": {
            "default": false,
            "title": "Overwrite",
            "type": "boolean"
          },
          "save": {
            "default": false,
            "title": "Save",
            "type": "boolean"
          }
        },
        "required": [
          "pages"
        ],
        "type": "object",
        "additionalProperties": false
      },
      "CommandResult": {
        "type": "object",
        "required": [
          "schema_version",
          "instance_id",
          "command_id",
          "kind",
          "cancel_mode",
          "job_ref"
        ],
        "properties": {
          "schema_version": {
            "type": "integer",
            "const": 2
          },
          "instance_id": {
            "type": "string",
            "minLength": 1
          },
          "command_id": {
            "type": "string",
            "minLength": 1
          },
          "kind": {
            "enum": [
              "cancel",
              "retry",
              "forget"
            ]
          },
          "cancel_mode": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              null,
              "queued_only",
              "cooperative",
              "forced"
            ]
          },
          "job_ref": {
            "oneOf": [
              {
                "type": "null"
              },
              {
                "$ref": "#/components/schemas/JobRef"
              }
            ]
          }
        },
        "additionalProperties": false
      },
      "ComponentVariantCatalog": {
        "type": "object",
        "description": "Structured catalog of optional feature dependency variants, carried by the runtime.component-selection.v1 capability descriptor. Servers MUST NOT list two variants with the same feature_id and accelerator, and MUST NOT list base runtime components that are not selectable. The catalog lists selectable variants only: clients map the user's feature and accelerator choice to component ids and send them as install_component_ids.",
        "required": [
          "variants"
        ],
        "properties": {
          "variants": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "$ref": "#/components/schemas/ComponentVariantDescriptor"
            }
          }
        },
        "additionalProperties": false
      },
      "ComponentVariantDescriptor": {
        "type": "object",
        "description": "One installable variant of an optional feature dependency for a given accelerator. feature_id is a stable capability-family grouping id declared by the Backend release (for example paddleocr or mineru); it never appears in requests, and features that are also plain-text OCR engines SHOULD reuse the OcrEngineId wire values. component_id is the runtime.component-repair.v1 component id the client requests via install_component_ids. The descriptor never carries display text or product defaults.",
        "required": [
          "feature_id",
          "accelerator",
          "component_id"
        ],
        "properties": {
          "feature_id": {
            "type": "string",
            "minLength": 1,
            "description": "Stable machine-readable feature grouping id defined by the Backend release; clients group catalog entries by it and never send it back."
          },
          "accelerator": {
            "type": "string",
            "enum": [
              "cpu",
              "nvidia_cuda"
            ],
            "description": "Accelerator this variant is built for; it must match the accelerator of the Runtime the selection installs into."
          },
          "component_id": {
            "type": "string",
            "minLength": 1,
            "description": "Runtime component id implementing this variant; selections reference it via install_component_ids and unknown ids fail closed with RUNTIME_COMPONENT_UNKNOWN."
          }
        },
        "additionalProperties": false
      },
      "DeletePagesRequest": {
        "properties": {
          "pages": {
            "items": {
              "type": "integer"
            },
            "title": "Pages",
            "type": "array"
          }
        },
        "required": [
          "pages"
        ],
        "type": "object",
        "additionalProperties": false
      },
      "DetectTextLayersRequest": {
        "properties": {
          "page": {
            "title": "Page",
            "type": "integer"
          }
        },
        "required": [
          "page"
        ],
        "type": "object",
        "additionalProperties": false
      },
      "DetectTextLayersResponse": {
        "properties": {
          "text_layers": {
            "items": {
              "$ref": "#/components/schemas/TextLayerInfoMirror"
            },
            "title": "Text Layers",
            "type": "array"
          }
        },
        "required": [
          "text_layers"
        ],
        "type": "object",
        "additionalProperties": false
      },
      "DownloadSourceCatalog": {
        "type": "object",
        "description": "Structured catalog of selectable download sources, carried by the runtime.download-sources.v1 capability descriptor. Servers MUST NOT list two sources with the same id across kinds. A selection contains at most one id for each source kind and array order has no priority meaning. Clients send the user's explicit selection; omission delegates to the Backend-declared default sources.",
        "required": [
          "sources"
        ],
        "properties": {
          "sources": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "$ref": "#/components/schemas/DownloadSourceDescriptor"
            }
          }
        },
        "additionalProperties": false
      },
      "DownloadSourceDescriptor": {
        "type": "object",
        "description": "One selectable download source declared by the Backend release. id is a stable source id the client echoes back in download_source_ids selections; ids are unique across the whole catalog. endpoint is the factual base URL clients may surface to users; the catalog never carries display text, localization or product defaults.",
        "required": [
          "kind",
          "id",
          "endpoint"
        ],
        "properties": {
          "kind": {
            "$ref": "#/components/schemas/DownloadSourceKind"
          },
          "id": {
            "type": "string",
            "minLength": 1,
            "description": "Stable machine-readable source id defined by the Backend release; selections reference it and unknown ids fail closed with DOWNLOAD_SOURCE_UNKNOWN."
          },
          "endpoint": {
            "type": "string",
            "minLength": 1,
            "description": "Factual base URL of the source; clients may render it verbatim but must not parse it."
          }
        },
        "additionalProperties": false
      },
      "DownloadSourceKind": {
        "type": "string",
        "description": "Open source-kind identifier. package_index selects a dependency package index; model_registry selects an upstream model-source preference that the Backend may encode for native engine downloaders. This preference does not make VibeOCR responsible for model files, downloads, caches, validation or repair. Clients preserve unknown response values and only offer selection UI for kinds they understand.",
        "x-vibeocr-known-values": [
          "package_index",
          "model_registry"
        ]
      },
      "Error": {
        "type": "object",
        "required": [
          "schema_version",
          "instance_id",
          "code",
          "message",
          "category",
          "retryable",
          "detail",
          "job_id"
        ],
        "properties": {
          "schema_version": {
            "type": "integer",
            "const": 2
          },
          "instance_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "code": {
            "type": "string",
