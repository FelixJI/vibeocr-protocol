      "RuntimeMaintenanceRequest": {
        "type": "object",
        "description": "Runtime maintenance start request. For ensure, install_component_ids is the manual optional-component scope: an empty array explicitly selects no optional components, omission selects the Backend default, and unknown ids fail closed with RUNTIME_COMPONENT_UNKNOWN. download_source_ids snapshots at most one source per kind into the operation; omission snapshots the current Backend setting/default. Clients MUST omit both fields when their capability is absent; they are invalid for inspect/repair. component_ids keeps its repair-scope meaning.",
        "required": [
          "operation"
        ],
        "properties": {
          "operation_id": {
            "type": "string",
            "minLength": 1
          },
          "operation": {
            "type": "string",
            "enum": [
              "inspect",
              "ensure",
              "repair"
            ]
          },
          "profile_id": {
            "type": "string",
            "minLength": 1
          },
          "component_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "install_component_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "download_source_ids": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "required_capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          }
        },
        "allOf": [
          {
            "if": {
              "anyOf": [
                {
                  "required": [
                    "install_component_ids"
                  ]
                },
                {
                  "required": [
                    "download_source_ids"
                  ]
                }
              ]
            },
            "then": {
              "properties": {
                "operation": {
                  "const": "ensure"
                }
              }
            }
          }
        ],
        "additionalProperties": false
      },
      "RuntimeMaintenanceCommandRequest": {
        "type": "object",
        "description": "Runtime maintenance command request. On retry, install_component_ids and download_source_ids may explicitly replace the source operation's normalized component/source intent; omission reuses it. An empty install_component_ids array explicitly selects no optional components. Selection fields are invalid for cancel and MUST be omitted when their capability is absent.",
        "required": [
          "command_id",
          "command",
          "target_operation_id"
        ],
        "properties": {
          "command_id": {
            "type": "string",
            "minLength": 1
          },
          "command": {
            "type": "string",
            "enum": [
              "cancel",
              "retry"
            ]
          },
          "target_operation_id": {
            "type": "string",
            "minLength": 1
          },
          "new_operation_id": {
            "type": "string",
            "minLength": 1
          },
          "expected_sequence": {
            "type": "integer",
            "minimum": 0
          },
          "install_component_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "download_source_ids": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "command": {
                  "const": "retry"
                }
              },
              "required": [
                "command"
              ]
            },
            "then": {
              "required": [
                "new_operation_id"
              ]
            }
          },
          {
            "if": {
              "anyOf": [
                {
                  "required": [
                    "install_component_ids"
                  ]
                },
                {
                  "required": [
                    "download_source_ids"
                  ]
                }
              ]
            },
            "then": {
              "properties": {
                "command": {
                  "const": "retry"
                }
              }
            }
          }
        ],
        "additionalProperties": false
      },
