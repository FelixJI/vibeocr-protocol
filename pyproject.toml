[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["packages/vibeocr-contracts-py/src", "packages/vibeocr-runtime-client-py/src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
asyncio_mode = "auto"
markers = ["slow: long-running integration or performance test"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "packages/vibeocr-contracts-py/src/vibeocr/runtime_contracts/generated",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
