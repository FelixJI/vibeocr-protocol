name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
        if: hashFiles('global.json') != ''
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev ./packages/vibeocr-contracts-py ./packages/vibeocr-runtime-client-py
          ./scripts/check-quality.ps1
          dotnet test tests/dotnet/VibeOCR.Contracts.Tests/VibeOCR.Contracts.Tests.csproj -c Release
          dotnet test tests/dotnet/VibeOCR.Runtime.Client.Tests/VibeOCR.Runtime.Client.Tests.csproj -c Release
